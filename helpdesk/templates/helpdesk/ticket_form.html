{% extends "helpdesk/base.html" %}

{% block title %}
Новая заявка — {{ block.super }}
{% endblock %}

{% block content %}

<div class="row">
    <div class="col-md-8">

        <h1 class="h3 mb-3">Новая заявка</h1>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button class="btn btn-primary" type="submit">
                Создать заявку
            </button>

            <a class="btn btn-link" href="{% url 'ticket_list' %}">
                Отмена
            </a>
        </form>

    </div>
</div>

{% endblock %}
